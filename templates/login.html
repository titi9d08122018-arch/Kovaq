<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro • KOVAQ Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kovaq: {
                            navy: '#0C2340',
                            orange: '#C23B00',
                            orangeBrand: '#FE5000',
                            orangeHover: '#9E3000',
                            border: '#D5DCE4',
                            control: '#7C8A9E',
                            slate: '#475569'
                        }
                    },
                    fontFamily: {
                        title: ['"Space Grotesk"', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="/static/css/kovaq.css">
    <style>
        body {
            background-color: #0C2340;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <main class="w-full max-w-md my-auto">
        <div class="bg-white rounded-2xl p-8 sm:p-10 shadow-xl border border-kovaq-border">
            <div class="text-center mb-7">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-kovaq-navy text-white mb-3" aria-hidden="true">
                    <i class="bi bi-cpu text-2xl text-kovaq-orangeBrand" aria-hidden="true"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-kovaq-navy tracking-tight font-title m-0">
                    KOVAQ <span class="text-kovaq-orange">Analytics</span>
                </h1>
                <p class="text-xs text-kovaq-slate mt-1.5 font-medium">
                    Panel de Control y Analítica de Percha
                </p>
            </div>

            {% if error %}
            <div id="login-error-alert" tabindex="-1" class="mb-5 p-3.5 bg-red-50 border border-red-300 text-red-800 text-xs rounded-xl flex items-start gap-2.5" role="alert">
                <i class="bi bi-exclamation-triangle-fill text-red-700 text-base shrink-0 mt-0.5" aria-hidden="true"></i>
                <div>
                    <span class="font-bold block text-red-900">Error de autenticación</span>
                    <span>{{ error }}</span>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-5" autocomplete="on">
                <div>
                    <label for="username" class="block text-xs font-bold text-kovaq-navy mb-2">
                        Correo electrónico o usuario
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        {% if not error %}autofocus{% endif %}
                        placeholder="usuario@empresa.com"
                        class="kovaq-input w-full min-h-[44px] text-sm font-medium"
                    >
                </div>

                <div>
                    <label for="passwordInput" class="block text-xs font-bold text-kovaq-navy mb-2">
                        Contraseña
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="passwordInput"
                            name="password"
                            required
                            autocomplete="current-password"
                            placeholder="Ingresa tu contraseña"
                            class="kovaq-input w-full min-h-[44px] pr-12 text-sm font-mono-num"
                        >
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-1 top-1/2 -translate-y-1/2 min-w-[40px] min-h-[40px] flex items-center justify-center text-kovaq-slate hover:text-kovaq-navy rounded-lg"
                            aria-label="Mostrar contraseña"
                        >
                            <i class="bi bi-eye text-base" id="eyeIcon" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-1">
                    <button type="submit" class="btn-kovaq-primary w-full min-h-[48px] text-sm">
                        <span>Iniciar Sesión</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const errAlert = document.getElementById('login-error-alert');
        if (errAlert) errAlert.focus();

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        if (togglePassword && passwordInput && eyeIcon) {
            togglePassword.addEventListener('click', function () {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                eyeIcon.classList.toggle('bi-eye', !isPassword);
                eyeIcon.classList.toggle('bi-eye-slash', isPassword);
                this.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        }
    </script>
</body>
</html>
